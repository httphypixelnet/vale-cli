# Every markup and source format Vale can lint.
name: lint
dir: fixtures/formats

cases:
  - name: excluded-folders
    dir: ../folders
    args: .
    exit: 0
    want: ""

  - name: css
    args: test.css
    exit: 0
    want: |
      test.css:1:4:vale.Annotations:'TODO' left in text
      test.css:7:19:vale.Annotations:'XXX' left in text

  - name: yaml
    args: test.yml
    exit: 0
    want: |
      test.yml:3:19:vale.Annotations:'TODO' left in text
      test.yml:15:45:vale.Annotations:'XXX' left in text

  - name: julia
    args: test.jl
    exit: 0
