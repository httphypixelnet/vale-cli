# `vale sync`, against each shape of package.
name: pkg
dir: fixtures/pkg

cases:
  - name: plain-progress
    about: "a progress bar redraws itself into a CI log and leaves no record
      of what was installed; `--plain-progress` swaps it for a line per package.
      See #1138."
    dir: style
    args: sync --plain-progress
    exit: 0
    contains: |
      Synced write-good

  - name: complete
    dir: complete
    args: test.md
    sync: true
    exit: 1
    contains: |
      test.md:11:1:Vale.Spelling:Did you really mean 'peut'?
      test.md:13:11:v3.MyProduct:Using 'easy' may come across as condescending.

  - name: style-only
    dir: style
    args: test.md
    sync: true
    exit: 1
    contains: |
      test.md:3:5:Vale.Spelling:Did you really mean 'Myproduct'?
      test.md:7:5:Vale.Spelling:Did you really mean 'Myproduct'?
      test.md:9:34:write-good.Passive:'be flagged' may be passive voice. Use active voice if you can.
      test.md:11:1:Vale.Spelling:Did you really mean 'peut'?
      test.md:13:11:write-good.Weasel:'very' is a weasel word!

  - name: config-only
    dir: config
    args: test.md
    sync: true
    exit: 1
    contains: |
      test.md:3:5:Vale.Spelling:Did you really mean 'Myproduct'?
      test.md:7:5:Vale.Spelling:Did you really mean 'Myproduct'?
      test.md:11:1:Vale.Spelling:Did you really mean 'peut'?

  - name: versioned
    dir: versioned
    args: test.md
    sync: true
    env:
      VALE_CACHE: styles/cache
    exists:
      - styles/cache/releases/Google@0.7.0/release.json
    exit: 1
    contains: |
      test.md:1:3:Google.Headings:'A Heading with a Period.' should use sentence-style capitalization.
      test.md:1:25:Google.HeadingPunctuation:Don't put a period at the end of a heading.
      test.md:3:1:Vale.Spelling:Did you really mean 'peut'?

  - name: versioned-range
    dir: versioned-range
    args: test.md
    sync: true
    exit: 1
    contains: |
      test.md:1:3:Google.Headings:'A Heading with a Period.' should use sentence-style capitalization.
      test.md:1:25:Google.HeadingPunctuation:Don't put a period at the end of a heading.
      test.md:3:1:Vale.Spelling:Did you really mean 'peut'?

  - name: versioned-invalid
    dir: versioned-invalid
    args: sync --plain-progress
    exit: 2
    contains: |
      'Google@invalid' is not a valid URL or the directory doesn't exist
