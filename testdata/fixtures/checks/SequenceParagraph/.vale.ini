# `scope: paragraph` on a `sequence` rule matched nothing and said nothing.
#
# Splitting wraps every block as `paragraph.<scope>`, so the scope describes
# the same blocks an undeclared one does -- but it was narrowed to
# `sentence.paragraph`, which is built for nothing at all. See #1126.
StylesPath = styles

MinAlertLevel = suggestion

[*.md]
BasedOnStyles = T
