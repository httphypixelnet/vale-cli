# A level given for a style covers its rules; one given for a rule wins.
#
# `MinAlertLevel = error` is what makes the difference observable: the two
# rules left at `suggestion` by the style-wide setting are filtered out, and
# only the rule that names itself survives.
StylesPath = ../../../styles

MinAlertLevel = error

[*.md]
BasedOnStyles = demo

demo = suggestion
demo.Spacing = error
